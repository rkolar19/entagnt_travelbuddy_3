name: Deploy Travel Buddy Agent

on:
  push:
    branches: [ main, dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    permissions:
      id-token: 'write'
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: '172748774286' # Use the Project Number here for consistency
          workload_identity_provider: 'projects/172748774286/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'ag-cicd-deployer@mydummy-1.iam.gserviceaccount.com'        
      
      - name: Set up Python & ADK
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-adk google-cloud-aiplatform[agent_engines]

      - name: Deploy to Vertex AI Agent Engine
        run: |
          # The 'adk deploy' command packages your Python logic for the cloud
          adk deploy agent_engine agents/travel_agent \
            --display_name "Travel Buddy 3 (${{ github.ref_name }})" \
            --region us-central1 \
            --staging_bucket gs://${{ vars.GCP_PROJECT_ID }}-staging